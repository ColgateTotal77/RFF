<script>

  const SENTENCE_END_REGEX = /[.!?。！？।॥؟።]/;
  const MAX_SENTENCE_LENGTH = 200;
  const SENTENCE_CONTAINER_SELECTOR =
    'p, div, h1, h2, h3, h4, h5, h6, li, blockquote, article, section, td';
  const DASH_CHARS = ['-', '‐', '‑', '‒', '–', '—', '−'];
  const DASH_CLASS = DASH_CHARS.map((ch) => (ch === '-' ? '\\-' : ch)).join('');
  const DASH_SPLIT_REGEX = new RegExp(`([${DASH_CLASS}]+)`);
  const PUNCTUATION_REGEX = /^[^\p{L}\d]+|[^\p{L}\d]+$/gu;

  const resolveTappedWord = (word, relOffset) => {
    const tokens = word.split(DASH_SPLIT_REGEX);
    if (tokens.length === 1) return word;

    const idx = Math.min(Math.max(relOffset, 0), word.length - 1);

    let pos = 0;
    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i];
      if (idx < pos + token.length) {
        return i % 2 === 0 ? token : word;
      }
      pos += token.length;
    }

    return word;
  };

  const segmenter =
    typeof Intl !== 'undefined' && Intl.Segmenter
      ? new Intl.Segmenter(undefined, { granularity: 'word' })
      : null;

  const resolveWordBounds = (text, offset) => {
    const spacedStart = text.lastIndexOf(' ', offset - 1) + 1;
    const spacedIndex = text.indexOf(' ', offset);
    const spacedEnd = spacedIndex === -1 ? text.length : spacedIndex;

    const unspaced = window.hasUnspacedText(text.substring(spacedStart, spacedEnd));
    if (!unspaced || !segmenter) return { start: spacedStart, end: spacedEnd, unspaced };

    for (const segment of segmenter.segment(text)) {
      const end = segment.index + segment.segment.length;
      if (offset < end) return { start: segment.index, end, unspaced };
    }

    return { start: spacedStart, end: spacedEnd, unspaced };
  };

  const charOffsetAt = (node, offset, x) => {
    if (offset <= 0) return offset;

    const prev = node.textContent[offset - 1];
    if (!prev || /\s/.test(prev)) return offset;

    const range = document.createRange();
    range.setStart(node, offset - 1);
    range.setEnd(node, offset);

    const rect = range.getClientRects()[0];
    return rect && x >= rect.left && x <= rect.right ? offset - 1 : offset;
  };

  const getTextOffset = (ancestor, node, offset) => {
    const walker = document.createTreeWalker(ancestor, NodeFilter.SHOW_TEXT);
    let total = 0;
    let current = walker.nextNode();
    while (current) {
      if (current === node) return total + offset;
      total += current.textContent.length;
      current = walker.nextNode();
    }
    return total;
  };

  const extractSentence = (container, start, end) => {
    const text = container.textContent;
    const length = text.length;

    let sentenceStart = 0;
    for (let i = start - 1; i >= 0; i--) {
      if (SENTENCE_END_REGEX.test(text[i])) {
        sentenceStart = i + 1;
        break;
      }
    }

    let sentenceEnd = length;
    for (let i = end; i < length; i++) {
      if (SENTENCE_END_REGEX.test(text[i])) {
        sentenceEnd = i + 1;
        break;
      }
    }

    let windowStart = sentenceStart;
    let windowEnd = sentenceEnd;

    if (sentenceEnd - sentenceStart > MAX_SENTENCE_LENGTH) {
      const padding = Math.floor((MAX_SENTENCE_LENGTH - (end - start)) / 2);
      windowStart = Math.max(sentenceStart, start - padding);
      windowEnd = Math.min(sentenceEnd, end + padding);
    }

    const snippet = text.slice(windowStart, windowEnd).replace(/\s+/g, ' ').trim();
    const prefix = windowStart > sentenceStart ? '…' : '';
    const suffix = windowEnd < sentenceEnd ? '…' : '';

    return `${prefix}${snippet}${suffix}`;
  };

  document.addEventListener('contextmenu', (event) => {
    event.preventDefault();
  });

  let selectionRafId = null;
  let lastSelectionText = '';
  document.addEventListener('selectionchange', () => {
    if (selectionRafId) cancelAnimationFrame(selectionRafId);

    selectionRafId = requestAnimationFrame(() => {
      selectionRafId = null;
      const selection = window.getSelection();
      const selectedText = selection.toString().trim();

      if (selectedText === lastSelectionText) return;
      lastSelectionText = selectedText;

      if (selectedText.length > 0) {
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const menuX = rect.left + rect.width / 2;
        const menuY = rect.top;
        const commonAncestor = range.commonAncestorContainer;

        let noteIds = null;
        let colorCode = null;

        const baseElement =
          commonAncestor.nodeType === Node.TEXT_NODE
            ? commonAncestor.parentElement
            : commonAncestor;

        const highlightedElement = baseElement.closest('.anki-word');

        if (highlightedElement) {
          noteIds = highlightedElement.getAttribute('data-note-ids');
          colorCode = highlightedElement.getAttribute('data-flag');
        }

        const sentenceContainer = baseElement.closest(SENTENCE_CONTAINER_SELECTOR) || baseElement;
        const startOffset = getTextOffset(sentenceContainer, range.startContainer, range.startOffset);
        const endOffset = getTextOffset(sentenceContainer, range.endContainer, range.endOffset);
        const sentence = extractSentence(sentenceContainer, startOffset, endOffset);

        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: 'TEXT_SELECTED',
            text: selectedText,
            sentence,
            top: menuY,
            bottom: rect.bottom,
            left: menuX,
            noteIds: noteIds ? noteIds : null,
            colorCode: colorCode ? colorCode : null,
          })
        );

        window.log(
          'TEXT_SELECTED: "' +
          selectedText.substring(0, 20) +
          (selectedText.length > 20 ? '...' : '') +
          '"'
        );
      } else {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: 'SELECTION_CLEARED',
          })
        );
        lastSelectionText = '';
      }
    });
  });

  let tapCount = 0;
  let tapTimer = null;
  let lastTapText = '';
  const resetTap = () => {
    clearTimeout(tapTimer);
    tapTimer = null;
    tapCount = 0;
    lastTapText = '';
  };

  const TAP_DELAY = 230;
  const SCROLL_THRESHOLD = 8;
  const LONG_PRESS_THRESHOLD = 400;

  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  document.addEventListener('touchstart', (event) => {
    if(event.touches.length > 1) {
      resetTap();
      return;
    }

    const touch = event.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = event.timeStamp;
  }, { passive: true });

  document.addEventListener('touchend', (event) => {
    if(event.touches.length > 0) {
      resetTap();
      return;
    }

    const touch = event.changedTouches[0];
    const dx = Math.abs(touch.clientX - touchStartX);
    const dy = Math.abs(touch.clientY - touchStartY);
    const duration = event.timeStamp - touchStartTime;

    if (dx > SCROLL_THRESHOLD || dy > SCROLL_THRESHOLD) {
      resetTap();
      return;
    }
    if (duration > LONG_PRESS_THRESHOLD) {
      resetTap();
      return;
    }

    const range = document.caretRangeFromPoint(touchStartX, touchStartY);

    if (!range || range.startContainer.nodeType !== Node.TEXT_NODE) {
      if (lastTapText !== '') {
        tapCount = 0;
        lastTapText = '';
      }

      tapCount++;
      clearTimeout(tapTimer);

      window.log(`TAP: non-text surface, count=${tapCount}`);

      tapTimer = setTimeout(() => {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ONE_TAP' }));
        lastSelectionText = '';
        tapCount = 0;
      }, TAP_DELAY);
      return;
    }

    const textNode = range.startContainer;
    const text = textNode.textContent;
    const offset = charOffsetAt(textNode, range.startOffset, touchStartX);

    const { start, end: rawEnd, unspaced } = resolveWordBounds(text, offset);
    const rawWord = text.substring(start, rawEnd);

    const highlightedElement = textNode.parentElement.closest('.anki-word');

    const rawSelection =
      unspaced && highlightedElement
        ? highlightedElement.textContent
        : resolveTappedWord(rawWord, offset - start);
    const selectedText = rawSelection.trim().replace(PUNCTUATION_REGEX, '');

    if (!selectedText) {
      resetTap();
      return;
    }

    const noteIds = highlightedElement?.dataset.noteIds || null;
    const colorCode = highlightedElement?.dataset.flag || null;

    if (selectedText !== lastTapText) {
      tapCount = 0;
      lastTapText = selectedText;
    }

    tapCount++;
    clearTimeout(tapTimer);

    window.log(`TAP: word="${selectedText}", count=${tapCount}`);

    if (tapCount === 3) {
      const sentenceContainer =
        textNode.parentElement.closest(SENTENCE_CONTAINER_SELECTOR) || textNode.parentElement;
      const wordStart = getTextOffset(sentenceContainer, textNode, start);
      const wordEnd = getTextOffset(sentenceContainer, textNode, rawEnd);
      const sentence = extractSentence(sentenceContainer, wordStart, wordEnd);

      window.ReactNativeWebView.postMessage(
        JSON.stringify({
          type: 'TRIPLE_TAP',
          text: selectedText,
          sentence,
          noteIds,
          colorCode,
        })
      );
      tapCount = 0;
    } else {
      tapTimer = setTimeout(() => {
        if (tapCount === 1) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ONE_TAP' }));
          lastSelectionText = '';
        } else if (tapCount === 2) {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: 'DOUBLE_TAP', text: selectedText })
          );
        }
        tapCount = 0;
      }, TAP_DELAY);
    }
  });
</script>
