<script>

  const SENTENCE_END_REGEX = /[.!?。！？।॥؟።]/;
  const MAX_SENTENCE_LENGTH = 200;
  const SENTENCE_CONTAINER_SELECTOR =
    'p, div, h1, h2, h3, h4, h5, h6, li, blockquote, article, section, td';
  const DASH_CHARS = ['-', '‐', '‑', '‒', '–', '—', '−'];
  const DASH_CLASS = DASH_CHARS.map((ch) => (ch === '-' ? '\\-' : ch)).join('');
  const DASH_SPLIT_REGEX = new RegExp(`([${DASH_CLASS}]+)`);
  const PUNCTUATION_REGEX = /^[^\p{L}\d]+|[^\p{L}\d]+$/gu;

  const resolveTappedWord = (word, relOffset) => {
    const tokens = word.split(DASH_SPLIT_REGEX);
    if (tokens.length === 1) return word;

    const idx = Math.min(Math.max(relOffset, 0), word.length - 1);

    let pos = 0;
    for (let i = 0; i < tokens.length; i++) {
      const token = tokens[i];
      if (idx < pos + token.length) {
        return i % 2 === 0 ? token : word;
      }
      pos += token.length;
    }

    return word;
  };

  const segmenter =
    typeof Intl !== 'undefined' && Intl.Segmenter
      ? new Intl.Segmenter(undefined, { granularity: 'word' })
      : null;

  const resolveWordBounds = (text, offset) => {
    const spacedStart = text.lastIndexOf(' ', offset - 1) + 1;
    const spacedIndex = text.indexOf(' ', offset);
    const spacedEnd = spacedIndex === -1 ? text.length : spacedIndex;

    const unspaced = window.hasUnspacedText(text.substring(spacedStart, spacedEnd));
    if (!unspaced || !segmenter) return { start: spacedStart, end: spacedEnd, unspaced };

    for (const segment of segmenter.segment(text)) {
      const end = segment.index + segment.segment.length;
      if (offset < end) return { start: segment.index, end, unspaced };
    }

    return { start: spacedStart, end: spacedEnd, unspaced };
  };

  const charOffsetAt = (node, offset, x) => {
    if (offset <= 0) return offset;

    const prev = node.textContent[offset - 1];
    if (!prev || /\s/.test(prev)) return offset;

    const range = document.createRange();
    range.setStart(node, offset - 1);
    range.setEnd(node, offset);

    const rect = range.getClientRects()[0];
    return rect && x >= rect.left && x <= rect.right ? offset - 1 : offset;
  };

  const getTextOffset = (ancestor, node, offset) => {
    const walker = document.createTreeWalker(ancestor, NodeFilter.SHOW_TEXT);
    let total = 0;
    let current = walker.nextNode();
    while (current) {
      if (current === node) return total + offset;
      total += current.textContent.length;
      current = walker.nextNode();
    }
    return total;
  };

  const extractSentence = (container, start, end) => {
    const text = container.textContent;
    const length = text.length;

    let sentenceStart = 0;
    for (let i = start - 1; i >= 0; i--) {
      if (SENTENCE_END_REGEX.test(text[i])) {
        sentenceStart = i + 1;
        break;
      }
    }

    let sentenceEnd = length;
    for (let i = end; i < length; i++) {
      if (SENTENCE_END_REGEX.test(text[i])) {
        sentenceEnd = i + 1;
        break;
      }
    }

    let windowStart = sentenceStart;
    let windowEnd = sentenceEnd;

    if (sentenceEnd - sentenceStart > MAX_SENTENCE_LENGTH) {
      const padding = Math.floor((MAX_SENTENCE_LENGTH - (end - start)) / 2);
      windowStart = Math.max(sentenceStart, start - padding);
      windowEnd = Math.min(sentenceEnd, end + padding);
    }

    const snippet = text.slice(windowStart, windowEnd).replace(/\s+/g, ' ').trim();
    const prefix = windowStart > sentenceStart ? '…' : '';
    const suffix = windowEnd < sentenceEnd ? '…' : '';

    return `${prefix}${snippet}${suffix}`;
  };

  document.addEventListener('contextmenu', (event) => {
    event.preventDefault();
  });

  const SELECTION_HIGHLIGHT = 'book-selection';
  const WORD_CHAR_REGEX = /[\p{L}\p{M}\d\uD800-\uDFFF]/u;

  let selectedRange = null;
  let lastSelectionText = '';
  let holdTimer = null;
  let pressedWord = null;
  let activeCaret = null;
  let caretGrabOffsetY = 0;

  const isWordBreak = (ch) => /\s/.test(ch) || DASH_CHARS.includes(ch);

  const wordRangeInNode = (node, offset) => {
    const text = node.textContent;
    const bounds = resolveWordBounds(text, offset);
    const index = Math.max(bounds.start, Math.min(offset, bounds.end - 1));
    if (bounds.end <= bounds.start || isWordBreak(text[index])) return null;

    let start = index;
    let end = index + 1;
    while (start > bounds.start && !isWordBreak(text[start - 1])) start--;
    while (end < bounds.end && !isWordBreak(text[end])) end++;
    while (start < end && !WORD_CHAR_REGEX.test(text[start])) start++;
    while (end > start && !WORD_CHAR_REGEX.test(text[end - 1])) end--;
    if (start === end) return null;

    const range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, end);
    return range;
  };

  const wordRangeAt = (x, y) => {
    const caretRange = document.caretRangeFromPoint(x, y);
    if (caretRange?.startContainer.nodeType !== Node.TEXT_NODE) return null;

    const node = caretRange.startContainer;
    return wordRangeInNode(node, charOffsetAt(node, caretRange.startOffset, x));
  };

  const unionRange = (a, b) => {
    const union = a.cloneRange();
    if (b.compareBoundaryPoints(Range.START_TO_START, a) < 0) union.setStart(b.startContainer, b.startOffset);
    if (b.compareBoundaryPoints(Range.END_TO_END, a) > 0) union.setEnd(b.endContainer, b.endOffset);
    return union;
  };

  const rangeText = (range) => {
    const fragment = range.cloneContents();
    fragment.querySelectorAll(SENTENCE_CONTAINER_SELECTOR).forEach((block) => block.append('\n'));
    return fragment.textContent.replace(/[ \t]*\n\s*/g, '\n').trim();
  };

  const createCaret = () => {
    const caret = document.createElement('div');
    caret.className = 'selection-caret';
    document.documentElement.append(caret);
    return caret;
  };

  const startCaret = createCaret();
  const endCaret = createCaret();
  const selectionCarets = [startCaret, endCaret];

  const setCaretsStyle = (property, value) =>
    selectionCarets.forEach((caret) => { caret.style[property] = value; });

  const caretScreenRect = (caret) => {
    const { left, top, right, bottom } = caret.getBoundingClientRect();
    return [left, top, right, bottom].map((value) => Math.round(value * window.devicePixelRatio));
  };

  const updateCaretGestureExclusion = () =>
    window.BookBridge.setCaretGestureExclusion(
      JSON.stringify(selectedRange ? selectionCarets.map(caretScreenRect) : [])
    );

  const placeCaret = (caret, x, rect) => {
    caret.style.left = `${x}px`;
    caret.style.top = `${rect.bottom + window.scrollY}px`;
    caret.style.display = 'block';
  };

  const placeCarets = () => {
    const rects = selectedRange.getClientRects();
    const last = rects[rects.length - 1];
    placeCaret(startCaret, rects[0].left, rects[0]);
    placeCaret(endCaret, last.right, last);
    updateCaretGestureExclusion();
  };

  const clearSelection = () => {
    selectedRange = null;
    lastSelectionText = '';
    CSS.highlights.delete(SELECTION_HIGHLIGHT);
    setCaretsStyle('display', 'none');
    updateCaretGestureExclusion();
  };

  window.addEventListener('scroll', () => { if (selectedRange) updateCaretGestureExclusion(); }, { passive: true });

  new ResizeObserver(() => {
    if (selectedRange) selectedRange.collapsed ? clearSelection() : placeCarets();
  }).observe(document.documentElement);

  const reportSelection = (range) => {
    const selectedText = rangeText(range);

    if (selectedText === lastSelectionText) return;
    if (selectedText.length <= 0) return;

    lastSelectionText = selectedText;

    const rect = range.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const menuX = rect.left + rect.width / 2;
    const menuY = rect.top;
    const commonAncestor = range.commonAncestorContainer;

    let noteIds = null;
    let colorCode = null;

    const baseElement =
      commonAncestor.nodeType === Node.TEXT_NODE
        ? commonAncestor.parentElement
        : commonAncestor;

    const highlightedElement = baseElement.closest('.anki-word');

    if (highlightedElement) {
      noteIds = highlightedElement.getAttribute('data-note-ids');
      colorCode = highlightedElement.getAttribute('data-flag');
    }

    const sentenceContainer = baseElement.closest(SENTENCE_CONTAINER_SELECTOR) || baseElement;
    const startOffset = getTextOffset(sentenceContainer, range.startContainer, range.startOffset);
    const endOffset = getTextOffset(sentenceContainer, range.endContainer, range.endOffset);
    const sentence = extractSentence(sentenceContainer, startOffset, endOffset);

    window.ReactNativeWebView.postMessage(
      JSON.stringify({
        type: 'TEXT_SELECTED',
        text: selectedText,
        sentence,
        top: menuY,
        bottom: rect.bottom,
        left: menuX,
        noteIds: noteIds ? noteIds : null,
        colorCode: colorCode ? colorCode : null,
      })
    );

    window.log(
      'TEXT_SELECTED: "' +
      selectedText.substring(0, 20) +
      (selectedText.length > 20 ? '...' : '') +
      '"'
    );
  };

  const setSelection = (range) => {
    selectedRange = range;
    CSS.highlights.set(SELECTION_HIGHLIGHT, new Highlight(range));
    placeCarets();
    reportSelection(range);
  };

  const moveActiveCaret = (x, y) => {
    const word = wordRangeAt(x, y);
    if (!word) return;

    const movingStart = activeCaret === startCaret;
    const next = selectedRange.cloneRange();
    if (movingStart) next.setStart(word.startContainer, word.startOffset);
    else next.setEnd(word.endContainer, word.endOffset);
    if (!next.collapsed) return setSelection(next);

    const pivot = movingStart
      ? wordRangeInNode(selectedRange.endContainer, selectedRange.endOffset - 1)
      : wordRangeInNode(selectedRange.startContainer, selectedRange.startOffset);

    activeCaret = movingStart ? endCaret : startCaret;
    setSelection(unionRange(pivot, word));
  };

  const endCaretDrag = (event) => {
    event.stopPropagation();
    activeCaret = null;
    setCaretsStyle('pointerEvents', '');
  };

  selectionCarets.forEach((caret) => {
    caret.addEventListener('touchstart', (event) => {
      event.preventDefault();
      event.stopPropagation();
      activeCaret = caret;
      const lineHeight = selectedRange.getClientRects()[0].height;
      caretGrabOffsetY = event.targetTouches[0].clientY - caret.getBoundingClientRect().top + lineHeight / 2;
      setCaretsStyle('pointerEvents', 'none');
    });

    caret.addEventListener('touchmove', (event) => {
      const touch = event.targetTouches[0];
      moveActiveCaret(touch.clientX, touch.clientY - caretGrabOffsetY);
    });

    caret.addEventListener('touchend', endCaretDrag);
    caret.addEventListener('touchcancel', endCaretDrag);
  });

  let tapCount = 0;
  let tapTimer = null;
  let lastTapText = '';
  const resetTap = () => {
    clearTimeout(tapTimer);
    tapTimer = null;
    tapCount = 0;
    lastTapText = '';
  };

  const TAP_DELAY = 230;
  const SCROLL_THRESHOLD = 8;
  const LONG_PRESS_THRESHOLD = 340;

  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;

  const endPress = () => {
    clearTimeout(holdTimer);
    pressedWord = null;
  };

  document.addEventListener('touchstart', (event) => {
    if(event.touches.length > 1) {
      endPress();
      resetTap();
      return;
    }

    const touch = event.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchStartTime = event.timeStamp;

    holdTimer = setTimeout(() => {
      pressedWord = wordRangeAt(touchStartX, touchStartY);
      if (!pressedWord) return;

      lastSelectionText = '';
      setSelection(pressedWord);
    }, LONG_PRESS_THRESHOLD);
  }, { passive: true });

  document.addEventListener('touchmove', (event) => {
    const { clientX: x, clientY: y } = event.touches[0];

    if (Math.hypot(x - touchStartX, y - touchStartY) > SCROLL_THRESHOLD) clearTimeout(holdTimer);
    if (!pressedWord) return;

    event.preventDefault();
    const word = wordRangeAt(x, y);
    if (word) setSelection(unionRange(pressedWord, word));
  }, { passive: false });

  document.addEventListener('touchcancel', endPress);

  document.addEventListener('touchend', (event) => {
    endPress();

    if(event.touches.length > 0) {
      resetTap();
      return;
    }

    const touch = event.changedTouches[0];
    const dx = Math.abs(touch.clientX - touchStartX);
    const dy = Math.abs(touch.clientY - touchStartY);
    const duration = event.timeStamp - touchStartTime;

    if (dx > SCROLL_THRESHOLD || dy > SCROLL_THRESHOLD) {
      resetTap();
      return;
    }
    if (duration > LONG_PRESS_THRESHOLD) {
      resetTap();
      return;
    }

    const range = document.caretRangeFromPoint(touchStartX, touchStartY);

    if (!range || range.startContainer.nodeType !== Node.TEXT_NODE) {
      if (lastTapText !== '') {
        tapCount = 0;
        lastTapText = '';
      }

      tapCount++;
      clearTimeout(tapTimer);

      window.log(`TAP: non-text surface, count=${tapCount}`);

      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ONE_TAP' }));
      clearSelection();
      tapCount = 0;
      return;
    }

    const textNode = range.startContainer;
    const text = textNode.textContent;
    const offset = charOffsetAt(textNode, range.startOffset, touchStartX);

    const { start, end: rawEnd, unspaced } = resolveWordBounds(text, offset);
    const rawWord = text.substring(start, rawEnd);

    const highlightedElement = textNode.parentElement.closest('.anki-word');

    const rawSelection =
      unspaced && highlightedElement
        ? highlightedElement.textContent
        : resolveTappedWord(rawWord, offset - start);
    const selectedText = rawSelection.trim().replace(PUNCTUATION_REGEX, '');

    if (!selectedText) {
      resetTap();
      return;
    }

    if (lastSelectionText) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ONE_TAP' }));
      clearSelection();
      return;
    }

    if (selectedText !== lastTapText) {
      tapCount = 0;
      lastTapText = selectedText;
    }

    tapCount++;
    clearTimeout(tapTimer);

    window.log(`TAP: word="${selectedText}", count=${tapCount}`);

    const noteIds = highlightedElement?.dataset.noteIds || null;
    const colorCode = highlightedElement?.dataset.flag || null;

    if (tapCount === 3) {
      const sentenceContainer =
        textNode.parentElement.closest(SENTENCE_CONTAINER_SELECTOR) || textNode.parentElement;
      const wordStart = getTextOffset(sentenceContainer, textNode, start);
      const wordEnd = getTextOffset(sentenceContainer, textNode, rawEnd);
      const sentence = extractSentence(sentenceContainer, wordStart, wordEnd);

      window.ReactNativeWebView.postMessage(
        JSON.stringify({
          type: 'TRIPLE_TAP',
          text: selectedText,
          sentence,
          noteIds,
          colorCode,
        })
      );
      tapCount = 0;
    } else {
      tapTimer = setTimeout(() => {
        if (tapCount === 1) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ONE_TAP' }));
          clearSelection();
        } else if (tapCount === 2) {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: 'DOUBLE_TAP', text: selectedText })
          );
        }
        tapCount = 0;
      }, TAP_DELAY);
    }
  });
</script>
