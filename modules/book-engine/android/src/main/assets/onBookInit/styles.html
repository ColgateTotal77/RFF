<style>
  :root {
    --book-font-size: 16px;
    --book-font-family: Georgia, serif;
    --book-bg-color: #ffffff;
    --book-text-color: #000000;
    --book-selection-bg: rgba(100, 150, 255, 0.4);
  }

  [data-theme='dark'] {
    --book-bg-color: #121212;
    --book-text-color: #e0e0e0;
    --book-selection-bg: rgba(100, 150, 255, 0.6);
  }

  body {
    padding: 20px !important;
    margin: 0 !important;
    text-align: justify;
    text-align-last: left;
    hyphens: auto;
    overflow-x: hidden !important;
    touch-action: pan-y !important;
    -webkit-tap-highlight-color: transparent !important;
    background-color: var(--book-bg-color) !important;
    font-size: var(--book-font-size) !important;
    color: var(--book-text-color) !important;
  }

  body p,
  body section,
  body article,
  body span:not([class*='dropcap']) {
    text-align: justify !important;
    text-align-last: left !important;
    hyphens: auto !important;
    font-size: var(--book-font-size) !important;
    color: var(--book-text-color) !important;
  }

  :root:not([data-font='Book Default']) body,
  :root:not([data-font='Book Default']) p,
  :root:not([data-font='Book Default']) section,
  :root:not([data-font='Book Default']) article,
  :root:not([data-font='Book Default']) span {
    font-family: var(--book-font-family), Georgia, serif !important;
  }

  img {
    display: block !important;
    max-width: 100% !important;
    height: auto !important;
    object-fit: contain !important;
    margin: 1em auto !important;
  }

  div[data-last-block-of-chapter='true'] {
    min-height: 100vh;
  }

  ::selection {
    background: var(--book-selection-bg);
  }

  .anki-word[data-flag]:not([data-flag='0']) {
    position: relative;
  }

  .anki-word[data-flag]::after {
    content: '';
    position: absolute;
    top: 3px;
    right: -6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .anki-word[data-flag='-1']::after {
    background-color: #9e9e9e;
  }
  .anki-word[data-flag='1']::after {
    background-color: #ff5252;
  }
  .anki-word[data-flag='2']::after {
    background-color: #ff9800;
  }
  .anki-word[data-flag='3']::after {
    background-color: #4caf50;
  }
  .anki-word[data-flag='4']::after {
    background-color: #2196f3;
  }
  .anki-word[data-flag='5']::after {
    background-color: #e91e63;
  }
  .anki-word[data-flag='6']::after {
    background-color: #00bcd4;
  }
  .anki-word[data-flag='7']::after {
    background-color: #9c27b0;
  }
  .anki-word[data-flag='8']::after {
    background-color: #607d8b;
  }
</style>
