<script>
  window.log = (message, type = 'info') => {
    window.ReactNativeWebView &&
      window.ReactNativeWebView.postMessage(
        JSON.stringify({
          type: 'LOG',
          logType: type,
          message: message,
        })
      );
  };

  window.resolveFontFamily = (family) => {
    if (family.includes(',')) return family;
    if (family.includes(' ')) return `"${family}"`;
    return family;
  };

  document.addEventListener('DOMContentLoaded', () => {
    window.isFetching = false;
    const config = window.BookConfig || {};

    const currentFont = window.resolveFontFamily(config.fontFamily || 'Georgia, serif');
    const currentFontSize = config.fontSize || 16;
    const currentTheme = config.theme || 'light';

    document.documentElement.style.setProperty('--book-font-family', currentFont);
    document.documentElement.style.setProperty('--book-font-size', `${currentFontSize}px`);

    document.documentElement.setAttribute('data-font', config.fontFamily);
    window.setTheme(currentTheme);

    window.log(
      'DOMContentLoaded: font=' +
        currentFont +
        ', size=' +
        currentFontSize +
        'px' +
        ', theme=' +
        currentTheme
    );

    window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'INITIAL_LOAD_COMPLETE' }));
  });

  document.addEventListener('contextmenu', (event) => {
    event.preventDefault();
  });

  let selectionRafId = null;
  let lastSelectionText = '';
  document.addEventListener('selectionchange', () => {
    if (selectionRafId) cancelAnimationFrame(selectionRafId);

    selectionRafId = requestAnimationFrame(() => {
      selectionRafId = null;
      const selection = window.getSelection();
      const selectedText = selection.toString().trim();

      if (selectedText === lastSelectionText) return;
      lastSelectionText = selectedText;

      if (selectedText.length > 0) {
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        if (rect.width === 0 || rect.height === 0) return;
        const menuX = rect.left + rect.width / 2;
        const menuY = rect.top;
        const commonAncestor = range.commonAncestorContainer;

        let noteIds = null;
        let colorCode = null;

        const baseElement =
          commonAncestor.nodeType === Node.TEXT_NODE
            ? commonAncestor.parentElement
            : commonAncestor;

        const highlightedElement = baseElement.closest('.anki-word');

        if (highlightedElement) {
          noteIds = highlightedElement.getAttribute('data-note-ids');
          colorCode = highlightedElement.getAttribute('data-flag');
        }

        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: 'TEXT_SELECTED',
            text: selectedText,
            top: menuY,
            left: menuX,
            noteIds: noteIds ? noteIds : null,
            colorCode: colorCode ? colorCode : null,
          })
        );

        window.log(
          'TEXT_SELECTED: "' +
            selectedText.substring(0, 20) +
            (selectedText.length > 20 ? '...' : '') +
            '"'
        );
      } else {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: 'SELECTION_CLEARED',
          })
        );
        lastSelectionText = '';
      }
    });
  });

  let tapCount = 0;
  let tapTimer = null;
  let lastTapText = '';
  const TAP_DELAY = 230;

  document.addEventListener('touchend', (event) => {
    const touch = event.changedTouches[0];
    const range = document.caretRangeFromPoint(touch.clientX, touch.clientY);

    if (!range || range.startContainer.nodeType !== Node.TEXT_NODE) return;

    const textNode = range.startContainer;
    const text = textNode.textContent;
    const offset = range.startOffset;

    const start = text.lastIndexOf(' ', offset - 1) + 1;
    const end = text.indexOf(' ', offset);
    const selectedText = text.substring(start, end === -1 ? text.length : end).trim();

    if (!selectedText) return;

    const highlightedElement = textNode.parentElement.closest('.anki-word');
    const noteIds = highlightedElement?.dataset.noteIds || null;
    const colorCode = highlightedElement?.dataset.flag || null;

    if (selectedText !== lastTapText) {
      tapCount = 0;
      lastTapText = selectedText;
    }

    tapCount++;
    clearTimeout(tapTimer);

    window.log(`TAP: word="${selectedText}", count=${tapCount}`);

    if (tapCount === 3) {
      window.ReactNativeWebView.postMessage(
        JSON.stringify({
          type: 'TRIPLE_TAP',
          text: selectedText,
          noteIds,
          colorCode,
        })
      );
      tapCount = 0;
    } else {
      tapTimer = setTimeout(() => {
        if (tapCount === 1 && lastSelectionText) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'SELECTION_CLEARED' }));
          lastSelectionText = '';
        } else if (tapCount === 2) {
          window.ReactNativeWebView.postMessage(
            JSON.stringify({ type: 'DOUBLE_TAP', text: selectedText })
          );
        }
        tapCount = 0;
      }, TAP_DELAY);
    }
  });

  document.addEventListener('click', (event) => {
    const anchor = event.target.closest('a');

    if (anchor) {
      const href = anchor.getAttribute('href');

      if (!href) return;

      if (href.startsWith('chapter://')) {
        event.preventDefault();

        window.log('BOOK_LINK_PRESSED: ' + href);
        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: 'BOOK_LINK_PRESSED',
            href: href,
          })
        );
      }
    }
  });

  window.setTheme = (theme) => {
    window.log('setTheme: ' + theme);
    document.documentElement.setAttribute('data-theme', theme);
  };

  window.setFontSize = (size) => {
    window.log('setFontSize: ' + size);
    document.documentElement.style.setProperty('--book-font-size', `${size}px`, 'important');
  };
  window.setFontFamily = (family) => {
    const resolved = window.resolveFontFamily(family);
    document.documentElement.setAttribute('data-font', family);
    document.documentElement.style.setProperty('--book-font-family', resolved, 'important');
    window.log('setFontFamily: ' + resolved);
  };
</script>
