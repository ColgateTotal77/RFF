<script>
  function scrollToBlock(targetBlockId, blockScrollPercent, instant) {
    return new Promise((resolve) => {
      var targetBlock = document.getElementById('block-' + targetBlockId);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (blockScrollPercent != null && blockScrollPercent > 0) {
            var top =
              window.scrollY +
              targetBlock.getBoundingClientRect().top +
              targetBlock.offsetHeight * blockScrollPercent;
            var isCloseToTop = Math.abs(window.scrollY - top) < 0.7 * window.innerHeight;
            window.scrollTo({ top: top, behavior: instant || !isCloseToTop ? 'instant' : 'smooth' });

            window.log(
              'instantScroll: scrolling to block-' +
                targetBlockId +
                ' at ' +
                blockScrollPercent +
                '%'
            );
          } else {
            var top =
              window.scrollY + targetBlock.getBoundingClientRect().top;

            var isCloseToTop = Math.abs(window.scrollY - top) < 0.7 * window.innerHeight;
            window.scrollTo({ top: top, behavior: instant || !isCloseToTop ? 'instant' : 'smooth' });
            window.log('instantScroll: scrolling to block-' + targetBlockId + ' at 0%');
          }
          resolve(true);
        });
      });
    });
  }

  let lastSentTime = 0;
  let ticking = false;

  function updateScrollPosition() {
    const blocks = document.querySelectorAll('div[id^="block-"]');
    if (blocks.length === 0) return;

    let blockId = 0;
    let currentRect;

    for (let i = 0; i < blocks.length; i++) {
      currentRect = blocks[i].getBoundingClientRect();
      if (currentRect.top <= 0 && currentRect.bottom > 0) {
        blockId = i;
        break;
      } else if (currentRect.top > 0) {
        break;
      }
    }

    const currentBlockScrollPercent =
      Math.abs(Math.min(0, currentRect.top)) / blocks[blockId].offsetHeight;
    const currentBlockId = blocks[blockId].id;
    const actualBlockId = parseInt(currentBlockId.replace('block-', ''));

    window.ReactNativeWebView.postMessage(
      JSON.stringify({
        type: 'SCROLL_POSITION_CHANGED',
        currentBlock: actualBlockId,
        currentBlockScrollPercent: currentBlockScrollPercent,
      })
    );
    window.log("SCROLL_POSITION_CHANGED: " + currentBlockScrollPercent)
  }

  window.addEventListener(
    'scroll',
    () => {
      if (window.isFetching) return;

      if (!ticking) {
        ticking = true;

        window.requestAnimationFrame(() => {
          const scrollY = window.scrollY;
          const bottomY = scrollY + window.innerHeight;
          const documentHeight = document.documentElement.scrollHeight;
          const blocks = document.querySelectorAll('div[id^="block-"]');

          if (blocks.length > 0 && documentHeight > window.innerHeight) {
            const firstBlockHeight = blocks[0].offsetHeight;
            const lastBlockHeight = blocks[blocks.length - 1].offsetHeight;

            if (scrollY < firstBlockHeight * 0.45) {
              window.isFetching = true;
              window.log('scroll: TOP_REACHED triggered');
              window.BookBridge.onTopReached();
            }
            if (bottomY > documentHeight - lastBlockHeight * 0.45) {
              window.isFetching = true;
              window.log('scroll: END_REACHED triggered');
              window.BookBridge.onEndReached();
            }
          }

          ticking = false;
        });
      }

      const now = Date.now();
      if (now - lastSentTime > 300) {
        lastSentTime = now;
        updateScrollPosition();
      }
    },
    { passive: true }
  );

  window.scrollToFragment = function (fragmentId) {
    const element = document.getElementById(fragmentId);
    if (element) {
      var top = window.scrollY + element.getBoundingClientRect().top;

      var isCloseToTop = Math.abs(window.scrollY - top) < 0.7 * window.innerHeight;
      window.scrollTo({ top: top, behavior: isCloseToTop ? 'smooth' : 'instant' });
      window.log('scrollToFragment: scrolling to ' + fragmentId);
    } else {
      window.error('scrollToFragment: fragment not found ' + fragmentId);
    }
  };
</script>
