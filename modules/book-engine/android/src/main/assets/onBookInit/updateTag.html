<script>
  window.updateTag = function (words, noteIdsString, colorCode) {
    window.log(`updateTag: words=${words}, noteIds=${noteIdsString}, colorCode=${colorCode}`);

    const wordArray = Array.isArray(words) ? words : [words];
    const targetWords = new Set(
      wordArray.map((w) => (w ? w.toLowerCase().trim() : '')).filter(Boolean)
    );

    if (colorCode === 'remove') {
      document.querySelectorAll('span.anki-word').forEach((span) => {
        if (targetWords.has(span.textContent.trim().toLowerCase()) || span.dataset.noteIds === noteIdsString) {
          span.replaceWith(...span.childNodes);
        }
      });
      return;
    }

    const updateByNoteId = targetWords.size === 0 && noteIdsString;
    document.querySelectorAll('span.anki-word').forEach((span) => {
      const isMatch = updateByNoteId
        ? span.dataset.noteIds === noteIdsString
        : targetWords.has(span.textContent.trim().toLowerCase());

      if (!isMatch) return;

      span.dataset.flag = colorCode;
      span.dataset.noteIds = noteIdsString;
    });

    if (targetWords.size === 0) return;

    const DASH_CHARS = '-‐‑‒–—−';
    const WORD_CHARS = `\\p{L}\\p{N}_`;
    const escapedWords = Array.from(targetWords).map((w) =>
      w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    );
    const combinedRegex = new RegExp(
      `(^|[^${WORD_CHARS}${DASH_CHARS}])(${escapedWords.join('|')})(?=[^${WORD_CHARS}${DASH_CHARS}]|$)`,
      'giu'
    );

    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        const parent = node.parentNode;
        if (['SCRIPT', 'STYLE'].includes(parent.nodeName)) return NodeFilter.FILTER_REJECT;
        if (parent.classList && parent.classList.contains('anki-word')) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      },
    });

    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) textNodes.push(node);

    textNodes.forEach((textNode) => {
      const matches = [];
      let match;
      while ((match = combinedRegex.exec(textNode.nodeValue)) !== null) {
        const start = match.index + match[1].length;
        matches.push({ start, length: match[2].length });
      }

      for (let i = matches.length - 1; i >= 0; i--) {
        const { start, length } = matches[i];

        const wordNode = textNode.splitText(start);
        wordNode.splitText(length);

        let nodeToWrap = wordNode;
        const parent = wordNode.parentNode;

        if (parent && parent.nodeName === 'MARK' && parent.classList.contains('search-highlight')) {
          if (
            parent.textContent.trim().toLowerCase() === wordNode.textContent.trim().toLowerCase()
          ) {
            nodeToWrap = parent;
          }
        }

        const span = document.createElement('span');
        span.className = 'anki-word';
        span.dataset.flag = colorCode;
        if (noteIdsString) span.dataset.noteIds = noteIdsString;

        nodeToWrap.parentNode.insertBefore(span, nodeToWrap);
        span.appendChild(nodeToWrap);
      }
    });

    window.log('updateTag: completed');
  };
</script>
