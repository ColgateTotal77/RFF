<style>
  mark.search-highlight {
    background-color: #fff59d;
    color: #000;
  }
</style>

<script>
  window.highlightAll = function (searchQuery) {
    return new Promise(function (resolve) {
      window.log('highlightAll: searching for "' + searchQuery + '" in all rendered blocks');

      window.searchQuery = searchQuery;

      var escapedWord = searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var flexiblePattern = escapedWord.replace(/\s+/g, '\\s*');
      var regex = new RegExp('(' + flexiblePattern + ')', 'gi');

      var allBlocks = document.querySelectorAll('div[id^="block-"]');

      allBlocks.forEach(function (blockContainer) {
        var blockIdx = blockContainer.id.replace('block-', '');

        var walker = document.createTreeWalker(blockContainer, NodeFilter.SHOW_TEXT, null, false);
        var node;
        var textNodes = [];

        while ((node = walker.nextNode())) {
          if (
            !['SCRIPT', 'STYLE'].includes(node.parentNode.nodeName) &&
            !node.parentNode.classList.contains('search-highlight')
          ) {
            textNodes.push(node);
          }
        }

        var localOccurrenceIndex = 0;

        textNodes.forEach(function (textNode) {
          var text = textNode.nodeValue;
          var match;
          var lastIndex = 0;
          var fragment = null;

          regex.lastIndex = 0;

          while ((match = regex.exec(text)) !== null) {
            if (!fragment) fragment = document.createDocumentFragment();

            if (match.index > lastIndex) {
              fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
            }

            var mark = document.createElement('mark');
            mark.className = 'search-highlight';
            mark.id = 'search-match-' + blockIdx + '-' + localOccurrenceIndex;
            mark.textContent = match[0];
            fragment.appendChild(mark);

            localOccurrenceIndex++;
            lastIndex = regex.lastIndex;
          }

          if (fragment) {
            if (lastIndex < text.length) {
              fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
            }
            textNode.parentNode.replaceChild(fragment, textNode);
          }
        });

        if (localOccurrenceIndex > 0) {
          window.log(
            'highlightAll: block-' + blockIdx + ' has ' + localOccurrenceIndex + ' matches'
          );
        }
      });

      requestAnimationFrame(function () {
        requestAnimationFrame(resolve);
      });
    });
  };

  window.jumpToSearch = function (blockId, occurrenceIndex) {
    window.log('jumpToSearch: jumping to block ' + blockId + ', occurrence ' + occurrenceIndex);
    document.querySelectorAll('mark.active-match').forEach(function (el) {
      el.classList.remove('active-match');
    });

    var targetId = 'search-match-' + blockId + '-' + occurrenceIndex;
    var target = document.getElementById(targetId);

    if (target) {
      target.classList.add('active-match');
      var targetRect = target.getBoundingClientRect();
      var top = window.scrollY + targetRect.top - window.innerHeight / 2 + targetRect.height / 2;

      var isCloseToTop = Math.abs(window.scrollY - top) < 0.7 * window.innerHeight;
      window.scrollTo({ top: top, behavior: isCloseToTop ? 'smooth' : 'instant' });
    } else {
      window.log(
        'jumpToSearch: target not found (search-match-' + blockId + '-' + occurrenceIndex + ')',
        'error'
      );
    }
  };

  window.clearSearch = function () {
    return new Promise(function (resolve) {
      var marks = document.querySelectorAll('mark.search-highlight');
      window.log('clearSearch: removing ' + marks.length + ' highlights');
      marks.forEach(function (mark) {
        var parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      });
      window.searchQuery = '';
      resolve();
    });
  };
</script>
