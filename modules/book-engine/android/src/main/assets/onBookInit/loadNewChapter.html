<script>
  window.loadNewBlock = function (htmlContent, position, fetchIndex) {
    window.log('loadNewBlock: inserting block ' + fetchIndex);

    if (!htmlContent) {
      window.log('loadNewBlock: ERROR - empty html content', 'error');
      window.isFetching = false;
      return;
    }

    try {
      var tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlContent;
      var blockElement = tempDiv.querySelector('[id^="block-"]');

      if (!blockElement) {
        window.log('loadNewBlock: ERROR - no block element found', 'error');
        window.isFetching = false;
        return;
      }

      var maxBlocks = 3;

      if (position === 'top') document.body.insertBefore(blockElement, document.body.firstChild);
      else document.body.appendChild(blockElement);

      var currentBlocksElements = Array.from(document.querySelectorAll('[id^="block-"]'));
      var maxBlocks = 3;

      while (currentBlocksElements.length > maxBlocks) {
        if (position === 'top') {
          var blockToRemove = currentBlocksElements.pop();
          if (blockToRemove) blockToRemove.remove();
        } else {
          var blockToRemove = currentBlocksElements.shift();
          if (blockToRemove) blockToRemove.remove();
        }
      }

      var newWindow = currentBlocksElements.map(function (el) {
        return parseInt(el.id.replace('block-', ''));
      });

      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: 'UPDATE_BLOCK_WINDOW',
            newWindow: newWindow,
          })
        );
      }

      if (window.searchQuery) window.highlightAll(window.searchQuery);
    } catch (error) {
      window.log('loadNewBlock: CAUGHT EXCEPTION - ' + error.message, 'error');
    } finally {
      window.isFetching = false;
    }
  };
</script>
