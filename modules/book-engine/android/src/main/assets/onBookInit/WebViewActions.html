<script>
  window.executeImmediateActions = async (action) => {
    switch (action.type) {
      case 'scrollToBlock':
        return window.scrollToBlock(action.blockId, action.scrollPercent);
      case 'scrollToFragment':
        window.scrollToFragment(action.fragmentId);
        return;
      case 'highlightAll':
        return window.highlightAll(action.query);
      case 'jumpToSearch':
        window.jumpToSearch(action.blockId, action.occurrenceIndex);
        return;
      case 'setTheme':
        window.setTheme(action.theme);
        return;
      case 'updateFont':
        if (action.fontSize != null) window.setFontSize(action.fontSize);
        if (action.fontFamily != null) window.setFontFamily(action.fontFamily);
        return;
      case 'updateTag':
        window.updateTag(action.word, action.noteIds, action.colorCode);
        return;
      case 'clearSearch':
        return window.clearSearch();
      default:
        window.log('executeImmediateActions: unknown type ' + action.type, 'error');
    }
  };

  window.executeQueueAction = async function (actions) {
    for (const action of actions) {
      await window.executeImmediateActions(action);
    }
    window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'QUEUE_ACTIONS_COMPLETE' }));
  };
</script>
